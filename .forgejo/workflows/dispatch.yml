name: Dependency Update

# Started by strip-owner when it delivers a change to fzt or fzt-terminal; never by hand. The take-up
# template closes any take-up still open, opens a PR taking them at their latest, has
# Forgejo merge it once its checks pass, and exits (PIPT-3). The merge is released the
# way every change here is.

on:
  workflow_dispatch:

concurrency:
  group: dependency-update
  cancel-in-progress: false

jobs:
  update:
    uses: romaine-life/pipeline-templates/.forgejo/workflows/go-dependency-update-template.yml@main
    secrets: inherit
    with:
      modules: github.com/romaine-life/fzt github.com/romaine-life/fzt-terminal
