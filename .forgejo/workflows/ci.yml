name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: romaine-life/pipeline-templates/actions/check-fetches@main
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo code=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE...HEAD")
          if grep -qvE '\.md$|^docs/|^LICENSE$' <<< "$files"; then
            echo code=true >> "$GITHUB_OUTPUT"
          fi

  # command folders run through sh on Linux and PowerShell on Windows; the
  # Windows runner (upstairspc, host mode) has no usable bash, so the two
  # OSes are separate jobs.
  go-linux:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: romaine-life/pipeline-templates/actions/setup-go@main
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  go-windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: romaine-life/pipeline-templates/actions/setup-go@main
        with:
          go-version-file: go.mod
      - run: |
          go vet ./...
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - run: |
          go test ./...
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  # build.yml publishes when release.yml dispatches it; this builds and signs
  # the same three binaries without uploading them, so a release is never
  # their first run.
  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      # Named after the number release.yml would give it; only release.yml releases.
      - name: Number the build
        id: version
        uses: romaine-life/pipeline-templates/actions/release-version@main
        with:
          prefix: v0.1
          publish: 'false'
      - uses: romaine-life/pipeline-templates/actions/setup-go@main
        with:
          go-version-file: go.mod
      - name: Build all platforms
        env:
          CGO_ENABLED: '0'
          TAG: ${{ steps.version.outputs.version }}
        run: |
          $engine = go list -m -f '{{.Version}}' github.com/romaine-life/fzt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($target in @(
            @{ os = 'windows'; arch = 'amd64'; output = 'fzt-automate-windows-amd64.exe' },
            @{ os = 'linux'; arch = 'amd64'; output = 'fzt-automate-linux-amd64' },
            @{ os = 'darwin'; arch = 'arm64'; output = 'fzt-automate-darwin-arm64' }
          )) {
            $env:GOOS = $target.os
            $env:GOARCH = $target.arch
            go build -ldflags="-X github.com/romaine-life/fzt/render.Version=$env:TAG -X github.com/romaine-life/fzt-frontend.EngineVersion=$engine" -o $target.output .
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Sign Windows binary
        env:
          PFX: ${{ secrets.AT_TERMINAL_PFX }}
          PFX_PASSWORD: ${{ secrets.AT_TERMINAL_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:PFX) { throw 'AT_TERMINAL_PFX is not set' }
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found' }
          $cert = Join-Path $env:RUNNER_TEMP "fzt-automate-$env:GITHUB_RUN_ID.pfx"
          [IO.File]::WriteAllBytes($cert, [Convert]::FromBase64String($env:PFX))
          try {
            & $signtool.FullName sign /fd SHA256 /f $cert /p $env:PFX_PASSWORD fzt-automate-windows-amd64.exe
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            & $signtool.FullName verify /pa fzt-automate-windows-amd64.exe
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          } finally { Remove-Item -LiteralPath $cert -Force }

  # The dry run of release.yml: the release token can write here and read the
  # v0.1.N series release.yml numbers from. Nothing is tagged or published.
  release-check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Validate release access
        env:
          TOKEN: ${{ secrets.PIPELINE_DISPATCH_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:TOKEN) { throw 'PIPELINE_DISPATCH_TOKEN is not set' }
          $repo = Invoke-RestMethod "$env:GITHUB_SERVER_URL/api/v1/repos/$env:GITHUB_REPOSITORY" -Headers @{ Authorization = "token $env:TOKEN" }
          if (-not $repo.permissions.push) { throw 'Release token cannot write this repository' }
      - name: Number as release.yml would
        id: version
        uses: romaine-life/pipeline-templates/actions/release-version@main
        with:
          prefix: v0.1
          publish: 'false'
          token: ${{ secrets.PIPELINE_DISPATCH_TOKEN }}
      - run: Write-Host "Validated release access; this build is ${{ steps.version.outputs.version }}; dry run complete"
