name: Build

# Pure Go cross-compiles all three assets on the fast Windows worker. PRs
# build and sign the same binaries without uploading them.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build artifacts for (and upload to)'
        required: true
        type: string

jobs:
  windows:
    runs-on: windows-latest
    outputs:
      release-tag: ${{ steps.upload.outputs.tag || 'validation-only' }}
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build all platforms
        env:
          CGO_ENABLED: '0'
        run: |
          $engine = go list -m -f '{{.Version}}' github.com/romaine-life/fzt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($target in @(
            @{ os = 'windows'; arch = 'amd64'; output = 'fzt-automate-windows-amd64.exe' },
            @{ os = 'linux'; arch = 'amd64'; output = 'fzt-automate-linux-amd64' },
            @{ os = 'darwin'; arch = 'arm64'; output = 'fzt-automate-darwin-arm64' }
          )) {
            $env:GOOS = $target.os
            $env:GOARCH = $target.arch
            go build -ldflags="-X github.com/romaine-life/fzt/render.Version=$env:TAG -X github.com/romaine-life/fzt-frontend.EngineVersion=$engine" -o $target.output .
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Sign Windows binary
        env:
          PFX: ${{ secrets.AT_TERMINAL_PFX }}
          PFX_PASSWORD: ${{ secrets.AT_TERMINAL_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:PFX) { throw 'AT_TERMINAL_PFX is not set' }
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found' }
          $cert = Join-Path $env:RUNNER_TEMP "fzt-automate-$env:GITHUB_RUN_ID.pfx"
          [IO.File]::WriteAllBytes($cert, [Convert]::FromBase64String($env:PFX))
          try {
            & $signtool.FullName sign /fd SHA256 /f $cert /p $env:PFX_PASSWORD fzt-automate-windows-amd64.exe
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            & $signtool.FullName verify /pa fzt-automate-windows-amd64.exe
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          } finally { Remove-Item -LiteralPath $cert -Force }
      - name: Upload to release
        id: upload
        if: github.event_name == 'workflow_dispatch'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $api = "$env:GITHUB_SERVER_URL/api/v1/repos/$env:GITHUB_REPOSITORY"
          $h = @{ Authorization = "token $env:TOKEN" }
          $rel = Invoke-RestMethod "$api/releases/tags/$env:TAG" -Headers $h
          foreach ($output in 'fzt-automate-windows-amd64.exe','fzt-automate-linux-amd64','fzt-automate-darwin-arm64') {
            $old = $rel.assets | Where-Object name -eq $output
            if ($old) { Invoke-RestMethod -Method Delete "$api/releases/$($rel.id)/assets/$($old.id)" -Headers $h }
            Invoke-RestMethod -Method Post "$api/releases/$($rel.id)/assets?name=$output" -Headers $h -Form @{ attachment = Get-Item $output } | Out-Null
          }
          "tag=$env:TAG" | Add-Content $env:GITHUB_OUTPUT
  built:
    needs: windows
    if: always()
    runs-on: windows-latest
    steps:
      - shell: pwsh
        env:
          RESULT: ${{ needs.windows.result }}
        run: |
          if ($env:RESULT -ne 'success') { throw "Build failed: $env:RESULT" }

  home-sync:
    needs: [windows, built]
    uses: romaine-life/pipeline-templates/.forgejo/workflows/home-sync.yml@main
    secrets: inherit
    with:
      release-tag: ${{ needs.windows.outputs.release-tag != 'validation-only' && needs.windows.outputs.release-tag || '' }}
