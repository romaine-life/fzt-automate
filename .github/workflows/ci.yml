name: CI

on:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        # command folders run through sh on Linux and PowerShell on Windows
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
