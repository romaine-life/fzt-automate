name: CI

on:
  pull_request:

jobs:
  go:
    name: go (${{ matrix.os }})
    strategy:
      matrix:
        # command folders run through sh on Linux and PowerShell on Windows
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  # The check main's ruleset requires: green only when every OS passed.
  test:
    needs: go
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.go.result }}" = success
